# IIRS (256 bands, ~15k train patches) — vae-our target = 24.47M params.
# Every field is optional; unset keys fall back to CLI / Settings defaults.

# --- Optimization ---
epochs: 100
lr: 1.0e-4
batch_size: 32
num_workers: 4
beta: 1.0e-3
lambda_physics: 0.3
seed: 42
weight_decay: 1.0e-5
early_stopping_patience: 7

# --- Baseline capacity (matches vae-our at IIRS within +/-2%) ---
vae_standard_base_ch: 134
vae_3d_base_ch: 78
vae_1d_hidden_dims: [4224, 2112, 1056]
