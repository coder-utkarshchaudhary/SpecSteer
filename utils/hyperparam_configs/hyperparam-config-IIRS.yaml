# IIRS (256 bands) — vae-our target = 10,871,625 params.
#
# Two controls are enforced in this file, and they are independent resources:
#   * LATENT RATE  — the information bottleneck, matched to 64:1 (see below)
#   * PARAMETERS   — the capacity of the function class, matched to vae-our
# Regenerate, in this order (rate first — it moves the parameter target):
#   python utils/match_latent_rate.py --ratio 64
#   python utils/check-model-params.py --solve
#   python utils/find_max_batch.py --budget-gb 24 --fit
# Audit:  python utils/check-model-params.py
#         python utils/match_latent_rate.py --ratio 64 --check

# --- Optimization ---
epochs: 30
lr: 1.0e-3

# Batch size is held constant across all 4 models x 2 loss regimes WITHIN this
# dataset — that is the axis the ablation compares on, so nothing about a row's
# result can be attributed to it. It is NOT held constant across datasets:
# there is no controlled comparison between sensors to protect (they differ in
# band count, scene count, spatial sampling and SNR), and this file already
# varies vae_3d_base_ch and friends per dataset for parameter matching. Forcing
# one global value would just idle the GPU on the lighter sensors.
#
# It DOES have to hold across platforms for this dataset, or within-dataset
# fairness breaks the moment one slot runs on Kaggle and another on the lab.
# Derived against the tightest budget any slot here will see — the lab's 24 GB:
#
#   binding model : vae-3d-spatio-spectral
#   memory        : ~0.476 GB/sample marginal, ~0.17 GB fixed
#   at B=32       : ~15.4 GB of the 20.4 GB usable (24 GB less 15% headroom)
#   HPC 40 GB     : headroom
#   Kaggle 2xT4   : nn.DataParallel puts 16 per 15 GB device — clears
#
# Rounded DOWN to a power of two, which keeps the DataParallel split even and
# leaves margin for fragmentation. Re-derive natively on the target GPU with:
#     PYTHONPATH=. python utils/find_max_batch.py --budget-gb 24 --time
# or, from a smaller card, add --fit to extrapolate from B=1,2,4.
# RE-DERIVED after the latent-rate change; the value did not move.
batch_size: 32
num_workers: 8

beta: 1.0e-3
lambda_physics: 0.3
seed: 42
weight_decay: 1.0e-5
early_stopping_patience: 7

# --- Latent budget: every model on the common target T = 16,384 (64.0:1) ---
#
# Rate and parameter count are INDEPENDENT resources — the bottleneck sets how
# much information can pass, the widths below set how complex a mapping can be
# learned — so the ablation controls for both.
#
# WHAT CHANGED, AND WHY. The previous version solved for a fixed 64:1 RATIO and
# let each model land wherever its quantisation allowed. On M3 that left vae-1d
# 23.8% below target, because a 64:1 target of 5,376 is not a multiple of 4,096
# and 4,096 is vae-1d's grain (one latent channel per 64x64 pixel).
#
# This version solves for a common reachable BUDGET instead: T = the nearest
# multiple of H*W = 4,096 to the 64:1 point. 4,096 is divisible by
# vae-standard's grain of 64, so BOTH per-pixel and spatial models land on T
# EXACTLY. Worst deviation across all four datasets drops 23.8% -> 6.2%.
#
# The two that do not land exactly:
#   vae-3d   — grain is (C_pad/8)*64, whose odd factor (11, 53, 57) makes an
#              exact common multiple astronomical. Padding its depth to a power
#              of two WOULD make it exact, and was rejected: on M3 that means 44
#              replicated bands, so only 65.6% of its latent depth would encode
#              real data. It would match the nominal number while mismatching
#              the effective rate the number is supposed to measure.
#   vae-our  — carries a latent_dim-sized global vector on top of a multiple of
#              4,096, so it is always +latent_dim above T. Forcing exactness
#              needs latent_dim = 4,096, which takes this model from 10.9M to
#              105.3M parameters and stops its spatial stream being a bottleneck
#              at all (8192 -> 4096 is a 2x squeeze).
#
# Latent SHAPE is deliberately not equalised — vae-standard is a spatial grid
# with no spectral axis, vae-our is a global vector beside a full-resolution
# per-pixel spectral map. That geometry IS the architecture under test. Only the
# scalar count matches.
#
# Regenerate with:  python utils/match_latent_rate.py --exact
# Verify with:      python utils/match_latent_rate.py --exact --check
spectral_latent_dim: 4           # vae-our  :  16,640 elements (+1.6%)
vae_standard_latent_ch: 256      # vae-std  :  16,384 elements (EXACT)
vae_3d_latent_ch: 8            # vae-3d   :  16,384 elements (EXACT)
vae_1d_latent_dim: 4            # vae-1d   :  16,384 elements (EXACT)
# worst deviation from T: 1.6% (tolerance +/-10%)

# --- Baseline capacity: matched to vae-our within 0.25% ---
#
# RE-SOLVED after the latent-budget change above. Order matters: the rate knobs
# feed the parameter count (vae-standard's 1x1 projections scale with
# latent_ch; vae-our's LazyLinear scales with spectral_latent_dim), so the
# parameter target moves whenever the latent does. Rate first, then parameters —
# never the reverse.
#
# NOTE: parameter matching is no longer the PRIMARY defence against the capacity
# confound. It is brittle (it moves every time the latent moves) and it forces
# four architectures onto one number they have no reason to share. The primary
# control is now post-hoc: capacity scaling curves, covariate regression on
# log2(params) and log2(latent), and the Pareto frontier — see CLAUDE.md 12.
# These widths are kept because a rough match costs nothing and removes the
# crudest objection.
#
# vae-our target = 10,871,625 params
# Regenerate with:  python utils/check-model-params.py --solve
vae_standard_base_ch: 86                # 10,868,244 (-0.03%)
vae_3d_base_ch: 45                      # 10,898,837 (+0.25%)
vae_1d_hidden_dims: [2748, 1374, 687]   # 10,883,718 (+0.11%)
