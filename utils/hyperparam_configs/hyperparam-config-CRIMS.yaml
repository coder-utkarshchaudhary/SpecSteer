# CRIMS (544 bands) — vae-our target = 72.99M params (largest in the sweep).
# Baseline widths seeded analytically from the closed-form param counts and
# should be re-audited with utils/check-model-params.py after any code change
# to modules/vae_*.py.

# --- Optimization ---
epochs: 100
lr: 1.0e-4
batch_size: 12         # scaled down from AVIRIS(16) — CRIMS activations ~1.28x larger spatially, ~1.65x spectrally
num_workers: 4
beta: 1.0e-3
lambda_physics: 0.3
seed: 42
weight_decay: 1.0e-5
early_stopping_patience: 7

# --- Baseline capacity (matches vae-our at CRIMS = 72.99M within +/-1%) ---
vae_standard_base_ch: 229                  # analytic: 72.82M (-0.24%)
vae_3d_base_ch: 134                        # analytic: 72.44M (-0.76%)
vae_1d_hidden_dims: [7184, 3592, 1796]     # analytic: 72.53M (-0.64%)
