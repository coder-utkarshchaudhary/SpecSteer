# M3 (84 bands, smallest models ~12M params) — fewer bands, smaller model,
# converges faster. Slightly higher lr and smaller batch as starting points.

# --- Optimization ---
epochs: 100
lr: 2.0e-4
batch_size: 24
num_workers: 4
beta: 1.0e-3
lambda_physics: 0.3
seed: 42
weight_decay: 1.0e-5
early_stopping_patience: 7

# --- Baseline capacity (matches vae-our at M3 = 12.15M within +/-3%) ---
vae_standard_base_ch: 94
vae_3d_base_ch: 54
vae_1d_hidden_dims: [3072, 1536, 768]
